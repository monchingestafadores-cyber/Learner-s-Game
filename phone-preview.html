<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metaphoria Phone Preview</title>
  <style>
    :root {
      --phone-width: 852px;
      --phone-height: 393px;
      --preview-scale: 1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101820;
      color: #f8ead2;
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .phone-preview {
      width: calc(var(--phone-width) * var(--preview-scale));
      height: calc(var(--phone-height) * var(--preview-scale));
      overflow: hidden;
      background: #000;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5);
    }

    iframe {
      display: block;
      width: var(--phone-width);
      height: var(--phone-height);
      border: 0;
      transform: scale(var(--preview-scale));
      transform-origin: top left;
      background: #000;
    }
  </style>
</head>
<body>
  <main class="phone-preview" aria-label="Phone landscape preview">
    <iframe src="index.html?phone-preview=landscape" title="Metaphoria phone landscape preview"></iframe>
  </main>

  <script>
    function updatePreviewScale() {
      const width = 852
      const height = 393
      const padding = 18
      const scale = Math.min(
        (window.innerWidth - padding) / width,
        (window.innerHeight - padding) / height
      )
      document.documentElement.style.setProperty("--preview-scale", Math.max(0.2, scale).toFixed(4))
    }

    updatePreviewScale()
    window.addEventListener("resize", updatePreviewScale)
  </script>
</body>
</html>
